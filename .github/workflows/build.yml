name: Bygg

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Bygg och lägg filerna på en befintlig release (t.ex. v0.3.0). Tomt = vanligt bygge.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  # håller go.sum (låsta versioner av beroenden) incheckad på main
  gosum:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: go mod tidy
        run: go mod tidy
      - name: Checka in ändringar
        run: |
          if [[ -n "$(git status --porcelain go.mod go.sum)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "Uppdatera go.sum"
            git push
          fi

  windows-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollera versionen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: |
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"; TAG="${TAG#v}"
          CODE=$(sed -n 's/^var Version = "\(.*\)"/\1/p' server/main.go)
          if [[ "$TAG" != "$CODE" ]]; then
            echo "::error::Taggen v$TAG stämmer inte med versionen i koden ($CODE). Ta bort taggen och skapa releasen från rätt commit (där server/main.go har $TAG)."
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Systempaket
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # man-db-triggern kan ta många minuter på GitHubs Ubuntu – stäng av den
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          # bara Ubuntus egna paketkällor (externa källor kan hänga)
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete || true
          APT="sudo -E apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dpkg::Use-Pty=0"
          for i in 1 2 3 4; do
            timeout 300 $APT update && \
            timeout 600 $APT install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev nsis imagemagick zip && exit 0
            echo "apt misslyckades – försöker igen ($i)"; sleep 15
          done
          exit 1
      - name: Beroenden
        run: go mod tidy
      - name: Tillverkarlista (MAC-prefix)
        run: go run ./tools/genoui || echo "IEEE-listan kunde inte hämtas – reservlistan används"
      - name: Tester
        run: go test ./core/... ./server
      # Valfri kodsignering. Lägg in ETT av alternativen som hemligheter (Settings → Secrets → Actions):
      #  A) Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #     AZURE_SIGN_ENDPOINT (t.ex. weu.codesigning.azure.net), AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE
      #  B) Certifikatfil (.pfx): WIN_CERT_PFX (base64) och WIN_CERT_PASSWORD
      # Utan hemligheterna byggs osignerade filer som tidigare.
      - name: Kodsignering (Windows)
        if: github.event_name != 'pull_request'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [[ -z "$AZURE_CLIENT_ID" && -z "$WIN_CERT_PFX" ]]; then echo "Inga signeringshemligheter – bygger osignerat"; exit 0; fi
          curl -fsSL -o "$RUNNER_TEMP/jsign.jar" https://github.com/ebourg/jsign/releases/download/7.1/jsign-7.1.jar
          echo "JSIGN=$RUNNER_TEMP/jsign.jar" >> "$GITHUB_ENV"
          if [[ -n "$AZURE_CLIENT_ID" ]]; then
            TOKEN=$(curl -fsS -X POST "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" \
              --data-urlencode "client_id=$AZURE_CLIENT_ID" --data-urlencode "client_secret=$AZURE_CLIENT_SECRET" \
              --data-urlencode "grant_type=client_credentials" --data-urlencode "scope=https://codesigning.azure.net/.default" | jq -r .access_token)
            echo "::add-mask::$TOKEN"
            echo "WIN_SIGN_ARGS=--storetype TRUSTEDSIGNING --keystore $AZURE_SIGN_ENDPOINT --storepass $TOKEN --alias $AZURE_SIGN_ACCOUNT/$AZURE_SIGN_PROFILE" >> "$GITHUB_ENV"
            echo "Signerar med Azure Trusted Signing"
          else
            echo "$WIN_CERT_PFX" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            echo "WIN_SIGN_ARGS=--storetype PKCS12 --keystore $RUNNER_TEMP/cert.pfx --storepass $WIN_CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "Signerar med certifikatfil"
          fi
      - name: Bygg Windows och Linux
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$RELEASE_TAG" ]]; then export VERSION="${RELEASE_TAG#v}"; fi
          scripts/build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
            dist/pingvakt-server-*.zip

  docker:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollera versionen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: |
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"; TAG="${TAG#v}"
          CODE=$(sed -n 's/^var Version = "\(.*\)"/\1/p' server/main.go)
          if [[ "$TAG" != "$CODE" ]]; then
            echo "::error::Taggen v$TAG stämmer inte med versionen i koden ($CODE). Ta bort taggen och skapa releasen från rätt commit (där server/main.go har $TAG)."
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Beroenden (go.sum)
        run: go mod tidy
      - name: Tillverkarlista (MAC-prefix)
        run: go run ./tools/genoui || echo "IEEE-listan kunde inte hämtas – reservlistan används"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Taggar
        id: tags
        run: |
          IMG=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-server
          if [[ -n "$RELEASE_TAG" ]]; then
            V="${RELEASE_TAG#v}"
            echo "tags=$IMG:$V,$IMG:latest" >> "$GITHUB_OUTPUT"; echo "version=$V" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            echo "tags=$IMG:$V,$IMG:latest" >> "$GITHUB_OUTPUT"; echo "version=$V" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMG:edge" >> "$GITHUB_OUTPUT"; echo "version=$(cat VERSION)-edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollera versionen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: |
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"; TAG="${TAG#v}"
          CODE=$(sed -n 's/^var Version = "\(.*\)"/\1/p' server/main.go)
          if [[ "$TAG" != "$CODE" ]]; then
            echo "::error::Taggen v$TAG stämmer inte med versionen i koden ($CODE). Ta bort taggen och skapa releasen från rätt commit (där server/main.go har $TAG)."
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Beroenden
        run: go mod tidy
      - name: Tillverkarlista (MAC-prefix)
        run: go run ./tools/genoui || echo "IEEE-listan kunde inte hämtas – reservlistan används"
      - name: Tester
        run: go test ./core/... ./server
      # Valfri signering och notarisering. Hemligheter:
      #   APPLE_CERT_P12 (base64 av "Developer ID Application"-certifikatet exporterat som .p12), APPLE_CERT_PASSWORD
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specifikt lösenord från appleid.apple.com) för notarisering
      - name: Signeringscertifikat (macOS)
        if: github.event_name != 'pull_request'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERT_P12" ]]; then echo "Inget certifikat – ad hoc-signering"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KP=$(openssl rand -hex 16)
          echo "$APPLE_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          if [[ -z "$ID" ]]; then echo "::error::Hittade inget Developer ID Application-certifikat i APPLE_CERT_P12"; exit 1; fi
          echo "MAC_SIGN_ID=$ID" >> "$GITHUB_ENV"
          echo "Signerar som $ID"
      - name: Bygg macOS
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$RELEASE_TAG" ]]; then export VERSION="${RELEASE_TAG#v}"; fi
          scripts/build.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*-macos-app.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [windows-linux, macos]
    runs-on: ubuntu-24.04
    steps:
      # bara byggresultaten – inte Docker-byggets egna poster
      - uses: actions/download-artifact@v4
        with:
          name: windows-linux
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            out/*-setup.exe
            out/*.zip
            out/*.deb
            out/*.tar.gz
            out/*.dmg
