name: Bygg

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Bygg och lägg filerna på en befintlig release (t.ex. v0.3.0). Tomt = vanligt bygge.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  # håller go.sum (låsta versioner av beroenden) incheckad på main
  gosum:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: go mod tidy
        run: go mod tidy
      - name: Checka in ändringar
        run: |
          if [[ -n "$(git status --porcelain go.mod go.sum)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "Uppdatera go.sum"
            git push
          fi

  windows-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Systempaket
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # man-db-triggern kan ta många minuter på GitHubs Ubuntu – stäng av den
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          # bara Ubuntus egna paketkällor (externa källor kan hänga)
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete || true
          APT="sudo -E apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dpkg::Use-Pty=0"
          for i in 1 2 3 4; do
            timeout 300 $APT update && \
            timeout 600 $APT install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev nsis imagemagick zip && exit 0
            echo "apt misslyckades – försöker igen ($i)"; sleep 15
          done
          exit 1
      - name: Beroenden
        run: go mod tidy
      - name: Tester
        run: go test ./core/... ./server
      - name: Bygg Windows och Linux
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$RELEASE_TAG" ]]; then export VERSION="${RELEASE_TAG#v}"; fi
          scripts/build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
            dist/pingvakt-server-*.zip

  docker:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Beroenden (go.sum)
        run: go mod tidy
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Taggar
        id: tags
        run: |
          IMG=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-server
          if [[ -n "$RELEASE_TAG" ]]; then
            V="${RELEASE_TAG#v}"
            echo "tags=$IMG:$V,$IMG:latest" >> "$GITHUB_OUTPUT"; echo "version=$V" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            echo "tags=$IMG:$V,$IMG:latest" >> "$GITHUB_OUTPUT"; echo "version=$V" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMG:edge" >> "$GITHUB_OUTPUT"; echo "version=$(cat VERSION)-edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Beroenden
        run: go mod tidy
      - name: Tester
        run: go test ./core/... ./server
      - name: Bygg macOS
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$RELEASE_TAG" ]]; then export VERSION="${RELEASE_TAG#v}"; fi
          scripts/build.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*-macos-app.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [windows-linux, macos]
    runs-on: ubuntu-24.04
    steps:
      # bara byggresultaten – inte Docker-byggets egna poster
      - uses: actions/download-artifact@v4
        with:
          name: windows-linux
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            out/*-setup.exe
            out/*.zip
            out/*.deb
            out/*.tar.gz
            out/*.dmg
